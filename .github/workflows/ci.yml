name: Offline evidence checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Python 3.11.9 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-22.04, windows-2022]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout with read-only token and no persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select exact Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'
          architecture: x64
          check-latest: false
      - name: Confirm interpreter
        run: python --version
      - name: Meaningful unit and CLI failure checks
        run: python -m unittest discover -s tests -v
      - name: Assert fresh offline demonstrations and expected-negative gates
        run: python scripts/check_demo.py --out work/ci-demo
